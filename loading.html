<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading | AMiR GAMiNG</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:#050505;
    color:white;

    font-family:Vazirmatn,sans-serif;

    overflow:hidden;

}



/* نورهای پس زمینه */

body::before{

    content:"";
    position:absolute;

    width:400px;
    height:400px;

    background:#00e5ff;

    filter:blur(150px);

    opacity:.25;

    animation:move 5s infinite alternate;

}



@keyframes move{

from{
transform:translate(-150px,-100px);
}

to{
transform:translate(150px,100px);
}

}




.logo{

    font-size:70px;

    font-weight:900;

    background:linear-gradient(90deg,#fff,#00e5ff,#8000ff,#fff);

    background-size:300%;

    -webkit-background-clip:text;

    color:transparent;

    animation:logo 4s infinite;

}



@keyframes logo{

from{
background-position:0;
}

to{
background-position:300%;
}

}




.loading{

    margin-top:40px;

    width:300px;

    height:10px;

    background:#222;

    border-radius:20px;

    overflow:hidden;

}



.loading span{

    display:block;

    height:100%;

    width:0%;

    background:#00e5ff;

    border-radius:20px;

    animation:load 3s forwards;

}



@keyframes load{

to{
width:100%;
}

}



.text{

    margin-top:20px;

    color:#aaa;

    font-size:20px;

}


</style>

</head>


<body>


<div class="logo">

AMiR GAMiNG

</div>


<div class="loading">

<span></span>

</div>


<div class="text">

در حال ورود به دنیای گیمینگ...

</div>


</body>


</html>
