```css
/* ================= PALM SCENE ================= */

.palm-scene{
    position:absolute;

    right:2%;
    bottom:-90px;

    width:330px;
    height:520px;

    z-index:-1;

    pointer-events:none;

    opacity:.88;

    filter:
        drop-shadow(
            0 0 18px
            rgba(155,53,255,.25)
        );

    transform:rotate(-2deg);
}


/* SVG */

.palm-svg{
    width:100%;
    height:100%;

    display:block;

    overflow:visible;
}


/* subtle movement */

.palm-scene{
    animation:
        palmFloat 6s ease-in-out infinite;
}


@keyframes palmFloat{

    0%,100%{
        transform:
            rotate(-2deg)
            translateY(0);
    }

    50%{
        transform:
            rotate(-1deg)
            translateY(-5px);
    }

}


/* MOBILE */

@media(max-width:850px){

    .palm-scene{
        right:-90px;
        bottom:-80px;

        width:280px;
        height:450px;

        opacity:.42;

        transform:scale(.8);
    }

}


@media(max-width:550px){

    .palm-scene{
        right:-125px;
        bottom:-100px;

        width:250px;
        height:410px;

        opacity:.25;
    }

}
