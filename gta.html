<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA V | AMiR GAMiNG</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Vazirmatn,sans-serif;
    background:#050505;
    color:white;
    text-align:center;
}


.hero{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:30px;

}



.hero img{

    width:90%;
    max-width:900px;
    height:400px;
    object-fit:cover;

    border-radius:25px;

    box-shadow:0 0 40px rgba(0,229,255,.5);

}



h1{

    font-size:55px;
    margin-top:30px;

}



h2{

    color:#00e5ff;

}



p{

    max-width:800px;
    color:#aaa;
    font-size:20px;
    line-height:2;

}



.features{

    margin-top:30px;

}



.features div{

    background:#151515;

    margin:15px auto;

    padding:15px;

    border-radius:15px;

    max-width:500px;

    transition:.3s;

}



.features div:hover{

    transform:scale(1.05);

    box-shadow:0 0 20px #00e5ff;

}



.button{

    display:inline-block;

    margin-top:30px;

    padding:15px 35px;

    background:white;

    color:black;

    text-decoration:none;

    border-radius:12px;

    font-weight:bold;

    transition:.3s;

}



.button:hover{

    transform:scale(1.1);

}


</style>

</head>


<body>


<section class="hero">


<img src="images/gta.jpg">


<h1>

🎮 GTA V

</h1>


<h2>

AMiR GAMiNG

</h2>


<p>

Grand Theft Auto V یکی از معروف‌ترین بازی‌های جهان است.
در شهر بزرگ Los Santos رانندگی کن، مأموریت انجام بده
و یک دنیای آزاد و هیجان‌انگیز را تجربه کن.

</p>



<div class="features">

<div>
🌆 دنیای باز و بزرگ
</div>

<div>
🚗 ماشین‌ها و وسایل نقلیه زیاد
</div>

<div>
🎯 مأموریت‌های جذاب
</div>

<div>
🌐 حالت آنلاین
</div>

</div>


<a class="button" href="index.html">

🏠 برگشت به خانه

</a>


</section>


</body>

</html>
